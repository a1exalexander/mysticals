appId: com.a1exalexander.mysticals
productName: Mysticals
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  # Used by the zip target (dmg sets its own). The in-app updater looks for the -${arch}-mac.zip asset.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Unsigned build, shared as-is.
  identity: null
  hardenedRuntime: false
dmg:
  artifactName: ${productName}-${version}-${arch}.dmg
