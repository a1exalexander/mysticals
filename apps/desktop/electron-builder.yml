appId: com.a1exalexander.mysticals
productName: Mysticals
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
# mysticals:// brings the app forward (the Google sign-in success page opens it).
protocols:
  - name: Mysticals
    schemes: [mysticals]
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  # Used by the zip target (dmg sets its own). The in-app updater looks for the -${arch}-mac.zip asset.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Signed with the "Developer ID Application" cert from CSC_LINK and notarized when APPLE_API_KEY,
  # APPLE_API_KEY_ID and APPLE_API_ISSUER are set (see release.yml). Hardened runtime uses
  # electron-builder's default Electron entitlements. Local builds without a cert: pnpm dist -c.mac.identity=-
  hardenedRuntime: true
# Installers carry no version in their name: the website links to releases/latest/download/<name>.
dmg:
  artifactName: ${productName}-${arch}.dmg
# Unsigned too: SmartScreen shows "More info → Run anyway" on first launch.
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: ${productName}-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  # Default comes from the scoped package name (@mysticals/desktop), which is not a valid file name.
  executableName: mysticals
  icon: build/icon.png
  category: Office
  # Required by the deb target.
  maintainer: Oleksandr Ratushnyi <forcewizu@gmail.com>
  artifactName: ${productName}-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
deb:
  # Default is productName ("Mysticals"); Debian package names must be lowercase.
  packageName: mysticals
