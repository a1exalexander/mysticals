appId: com.a1exalexander.multicals
productName: Multicals
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  # Local unsigned build. To sign + notarize later:
  #   1. Install a "Developer ID Application" certificate in your keychain.
  #   2. Remove `identity: null` (or set it to the certificate name).
  #   3. Set hardenedRuntime: true and add `notarize: true`, then export
  #      APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID before `pnpm dist`.
  identity: null
  hardenedRuntime: false
dmg:
  artifactName: ${productName}-${version}-${arch}.dmg
