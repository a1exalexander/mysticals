appId: com.a1exalexander.multicals
productName: Multicals
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  # Unsigned build, shared as-is.
  identity: null
  hardenedRuntime: false
dmg:
  artifactName: ${productName}-${version}-${arch}.dmg
