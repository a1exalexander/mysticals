name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  desktop:
    needs: check
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      MYSTICALS_GOOGLE_CLIENT_ID: ${{ secrets.MYSTICALS_GOOGLE_CLIENT_ID }}
      MYSTICALS_GOOGLE_CLIENT_SECRET: ${{ secrets.MYSTICALS_GOOGLE_CLIENT_SECRET }}
      MYSTICALS_POSTHOG_KEY: ${{ secrets.MYSTICALS_POSTHOG_KEY }}
      # Baked into the macOS app so the updater only accepts bundles signed by this team.
      MYSTICALS_APPLE_TEAM_ID: ${{ secrets.MYSTICALS_APPLE_TEAM_ID }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches apps/desktop version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./apps/desktop/package.json').version")"
      - name: Check Google OAuth secrets are set
        run: test -n "$MYSTICALS_GOOGLE_CLIENT_ID" && test -n "$MYSTICALS_GOOGLE_CLIENT_SECRET" || { echo "::error::MYSTICALS_GOOGLE_CLIENT_ID/SECRET secrets are empty"; exit 1; }
      - name: Build
        run: pnpm --filter @mysticals/desktop build
      - name: Check Apple signing secrets are set
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER MYSTICALS_APPLE_TEAM_ID; do
            test -n "${!v}" || { echo "::error::$v secret is empty"; exit 1; }
          done
          # electron-builder wants the App Store Connect key as a file path.
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      # macOS: dmg + zip (arm64 + x64), signed with Developer ID and notarized; Windows: nsis .exe; Linux: AppImage + deb.
      # Targets live in electron-builder.yml. The Apple env is empty off macOS, so Windows stays unsigned.
      - name: Package
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && format('{0}/AuthKey.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
        run: pnpm --filter @mysticals/desktop dist --publish never
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        run: |
          for app in apps/desktop/dist/mac*/Mysticals.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -q "TeamIdentifier=$MYSTICALS_APPLE_TEAM_ID"
            spctl --assess --type execute -vv "$app"
            xcrun stapler validate "$app"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*-mac.zip
            apps/desktop/dist/*-setup.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb

  # One job creates/updates the release so the three builds never race on `gh release create`.
  publish:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls artifacts/*)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files --generate-notes
          fi

  # After the GitHub Release, so npm never ships a version whose desktop builds failed.
  npm:
    needs: publish
    runs-on: ubuntu-latest
    env:
      # prepublishOnly rebuilds dist/cli.js, so the client and PostHog key must be in the publish step's env.
      MYSTICALS_GOOGLE_CLIENT_ID: ${{ secrets.MYSTICALS_GOOGLE_CLIENT_ID }}
      MYSTICALS_GOOGLE_CLIENT_SECRET: ${{ secrets.MYSTICALS_GOOGLE_CLIENT_SECRET }}
      MYSTICALS_POSTHOG_KEY: ${{ secrets.MYSTICALS_POSTHOG_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches apps/terminal version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./apps/terminal/package.json').version")"
      - name: Check Google OAuth secrets are set
        run: test -n "$MYSTICALS_GOOGLE_CLIENT_ID" && test -n "$MYSTICALS_GOOGLE_CLIENT_SECRET" || { echo "::error::MYSTICALS_GOOGLE_CLIENT_ID/SECRET secrets are empty"; exit 1; }
      - name: Publish (builds via prepublishOnly)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "mysticals@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "mysticals@${GITHUB_REF_NAME#v} is already on npm, skipping"
          else
            pnpm --filter mysticals publish --no-git-checks --access public
          fi
