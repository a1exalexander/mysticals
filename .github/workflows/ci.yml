name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml gates desktop builds and the npm publish on this

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @mysticals/landing build

  # The terminal app ships to macOS and Windows too. Desktop Playwright e2e is not run here.
  terminal:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          # daemon.e2e.test.ts lists processes with `ps`, which Windows lacks.
          - os: windows-latest
            args: --exclude src/daemon/daemon.e2e.test.ts
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mysticals test ${{ matrix.args }}
